<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Central de Aplicativos</title>
  <style>
    /* Variáveis Nativas */
    :root {
      --bg-color: #f0f2f5;
      --sidebar-color: #ffffff;
      --primary-blue: #4285f4;
      --text-color: #333;
      --card-bg: #ffffff;
    }

    /* Variáveis do Modo Escuro (Dark Mode) */
    body.dark-mode {
      --bg-color: #121212;
      --sidebar-color: #1e1e1e;
      --primary-blue: #bb86fc;
      --text-color: #e0e0e0;
      --card-bg: #2c2c2c;
    }

    body { 
      margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, sans-serif; 
      background-color: var(--bg-color); color: var(--text-color); 
      height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s;
      background-size: cover; background-position: center; /* Para a imagem de fundo */
    }

    /* Menu Lateral */
    #sidebar { 
      width: 250px; background: var(--sidebar-color); border-right: 1px solid #ccc; 
      display: flex; flex-direction: column; transition: width 0.3s ease; position: relative;
    }
    #sidebar.collapsed { width: 70px; }
    #sidebar.collapsed .menu-text, #sidebar.collapsed h3 { display: none; }
    .menu-item { display: flex; align-items: center; padding: 15px; color: var(--text-color); text-decoration: none; cursor: pointer; }
    .menu-item:hover { background-color: rgba(0,0,0,0.1); }
    .menu-icon { font-size: 20px; margin-right: 15px; }

    #toggle-btn { background: var(--primary-blue); color: white; border: none; padding: 10px; cursor: pointer; font-size: 20px; }

    /* Área Central */
    #main-content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; }
    #area-botoes { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; flex: 1; }

    /* Cards dos Apps com Ações */
    .app-card {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 150px; height: 130px; background: var(--card-bg); border-radius: 15px;
      text-decoration: none; color: var(--text-color); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .app-card:hover { transform: translateY(-5px); }
    .app-emoji { font-size: 40px; margin-bottom: 10px; }
    .app-name { font-weight: 600; font-size: 13px; text-align: center; }
    
    /* Botões de Ação no Card (Editar e Compartilhar) */
    .card-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; }
    .card-btn { background: rgba(0,0,0,0.1); border: none; border-radius: 50%; cursor: pointer; padding: 5px; font-size: 12px; }
    .card-btn:hover { background: var(--primary-blue); color: white; }

    /* Modais Genéricos */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: var(--sidebar-color); padding: 30px; border-radius: 10px; width: 320px; display: flex; flex-direction: column; gap: 15px; color: var(--text-color); }
    .modal-box input, .modal-box select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 90%; }
    .btn-salvar { background: var(--primary-blue); color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-fechar { background: #ccc; color: #333; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }

    /* Rodapé (Footer) */
    footer { text-align: center; padding: 15px; margin-top: auto; font-size: 12px; color: var(--text-color); }
    .store-badges { display: flex; justify-content: center; gap: 10px; margin-bottom: 5px; }
    .store-badges img { height: 30px; object-fit: contain; }

  </style>
</head>
<body>

  <nav id="sidebar">
    <button id="toggle-btn" onclick="toggleMenu()">☰</button>
    <h3 style="padding: 15px;">Configurações</h3>
    
    <a class="menu-item" onclick="abrirModal('modalApp')">
      <span class="menu-icon">➕</span><span class="menu-text">Adicionar App</span>
    </a>
    
    <a class="menu-item" onclick="abrirModal('modalPerfil')">
      <span class="menu-icon">👤</span><span class="menu-text">Meu Perfil</span>
    </a>
  </nav>

  <main id="main-content">
    <h1>Meus Aplicativos</h1>
    
    <div id="area-botoes"><p>Carregando...</p></div>

    <footer>
      <div class="store-badges">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
      </div>
      <div>Since @2026 - Versão 1.0 - Build 09.06.26</div>
    </footer>
  </main>

  <div id="modalApp" class="modal-overlay">
    <div class="modal-box">
      <h2 id="tituloModalApp">Novo Aplicativo</h2>
      <input type="hidden" id="inputId"> <input type="text" id="inputNome" placeholder="Nome">
      <input type="url" id="inputUrl" placeholder="Link">
      <input type="text" id="inputEmoji" placeholder="Emoji">
      <button class="btn-salvar" onclick="salvarApp()">Salvar</button>
      <button class="btn-fechar" onclick="fecharModal('modalApp')">Cancelar</button>
    </div>
  </div>

  <div id="modalPerfil" class="modal-overlay">
    <div class="modal-box">
      <h2>Meu Perfil / Aparência</h2>
      
      <label>Tema da Interface:</label>
      <select id="selectTema" onchange="aplicarTema(this.value)">
        <option value="claro">Claro</option>
        <option value="escuro">Escuro (Dark Mode)</option>
      </select>

      <label>Plano de Fundo (Foto):</label>
      <input type="file" id="inputImagem" accept="image/*">
      <small style="font-size: 10px;">Recomendado imagens pequenas para não travar o servidor.</small>

      <button class="btn-salvar" onclick="salvarPerfil()">Salvar Configurações</button>
      <button class="btn-fechar" onclick="fecharModal('modalPerfil')">Cancelar</button>
    </div>
  </div>

  <script>
    // COLE AQUI SUA NOVA URL DO APPS SCRIPT!
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyldA2GzE2x9CqPOuTeXM67NblofydovVeo-qOKGcI7prlL1EWS0eGB61bIRD1fB2Zt/exec';

    let imagemBase64Global = ""; // Variável para guardar a imagem convertida

    // --- FUNÇÕES DE INTERFACE ---
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('collapsed'); }
    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { 
      document.getElementById(id).style.display = 'none'; 
      document.getElementById('inputId').value = ''; // Limpa ID
    }

    function aplicarTema(tema) {
      if(tema === 'escuro') { document.body.classList.add('dark-mode'); } 
      else { document.body.classList.remove('dark-mode'); }
    }

    // --- CARREGAR DADOS DO BANCO (GET) ---
    function carregarDados() {
      fetch(URL_SCRIPT)
        .then(res => res.json())
        .then(resposta => {
          // 1. Aplica as configurações de Perfil
          if(resposta.config) {
            aplicarTema(resposta.config.tema);
            document.getElementById('selectTema').value = resposta.config.tema;
            if(resposta.config.imagem) {
              document.body.style.backgroundImage = `url('${resposta.config.imagem}')`;
              imagemBase64Global = resposta.config.imagem;
            }
          }

          // 2. Monta os botões
          const container = document.getElementById('area-botoes');
          container.innerHTML = ''; 
          resposta.apps.forEach(app => {
            const card = document.createElement('div');
            card.className = 'app-card';
            
            card.innerHTML = `
              <div class="card-actions">
                <button class="card-btn" onclick="prepararEdicao(${app.id}, '${app.nome}', '${app.url}', '${app.emoji}')" title="Editar">⚙️</button>
                <button class="card-btn" onclick="compartilharLink('${app.url}')" title="Compartilhar">🔗</button>
              </div>
              <a href="${app.url}" target="_blank" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; align-items:center;">
                <div class="app-emoji">${app.emoji}</div>
                <div class="app-name">${app.nome}</div>
              </a>
            `;
            container.appendChild(card);
          });
        })
        .catch(err => console.error("Erro ao carregar:", err));
    }

    // --- FUNÇÕES DOS APPS (POST: Adicionar e Editar) ---
    function salvarApp() {
      const id = document.getElementById('inputId').value;
      const nome = document.getElementById('inputNome').value;
      const url = document.getElementById('inputUrl').value;
      const emoji = document.getElementById('inputEmoji').value;

      const dados = {
        action: id ? "editar" : "adicionar", // O recepcionista vai ler isso!
        id: id ? parseInt(id) : null,
        nome: nome, url: url, emoji: emoji
      };

      fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) })
      .then(() => {
        alert('App salvo!');
        fecharModal('modalApp');
        carregarDados(); // Atualiza a tela
      });
    }

    function prepararEdicao(id, nome, url, emoji) {
      document.getElementById('tituloModalApp').innerText = "Editar Aplicativo";
      document.getElementById('inputId').value = id;
      document.getElementById('inputNome').value = nome;
      document.getElementById('inputUrl').value = url;
      document.getElementById('inputEmoji').value = emoji;
      abrirModal('modalApp');
    }

    function compartilharLink(url) {
      navigator.clipboard.writeText(url).then(() => alert("Link copiado para a área de transferência!"));
    }

    // --- FUNÇÕES DE PERFIL / IMAGEM (POST: Perfil) ---
    // Transforma a imagem selecionada em código Base64
    document.getElementById('inputImagem').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagemBase64Global = e.target.result; // Guarda o código da imagem
          document.body.style.backgroundImage = `url('${imagemBase64Global}')`; // Mostra na hora
        };
        reader.readAsDataURL(file);
      }
    });

    function salvarPerfil() {
      const tema = document.getElementById('selectTema').value;
      const dados = {
        action: "salvar_perfil",
        tema: tema,
        imagemBase64: imagemBase64Global
      };

      fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) })
      .then(() => {
        alert('Perfil salvo com sucesso!');
        fecharModal('modalPerfil');
      });
    }

    // Inicializa carregando tudo
    carregarDados();
  </script>
</body>
</html>
