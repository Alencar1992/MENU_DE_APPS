<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Meus Aplicativos</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4285f4">
  
  <link rel="apple-touch-icon" href="iconA.png">
  <link rel="icon" sizes="192x192" href="iconA.png">

  <style>
    /* Variáveis Nativas e Escalas de Sombra 3D */
    :root {
      --bg-color: #e0e5ec;
      --sidebar-color: rgba(255, 255, 255, 0.7);
      --primary-blue: #4285f4;
      --text-color: #333;
      --card-bg: linear-gradient(145deg, #ffffff, #e6e6e6);
      --shadow-3d: 8px 8px 16px #bebebe, -8px -8px 16px #ffffff;
      --inset-3d: inset 8px 8px 16px #bebebe, inset -8px -8px 16px #ffffff;
      --modal-bg: rgba(255, 255, 255, 0.85);
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --sidebar-color: rgba(30, 30, 30, 0.8);
      --primary-blue: #bb86fc;
      --text-color: #e0e0e0;
      --card-bg: linear-gradient(145deg, #2c2c2c, #1f1f1f);
      --shadow-3d: 8px 8px 16px #0b0b0b, -8px -8px 16px #292929;
      --inset-3d: inset 8px 8px 16px #0b0b0b, inset -8px -8px 16px #292929;
      --modal-bg: rgba(30, 30, 30, 0.85);
    }

    body { 
      margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, sans-serif; 
      background-color: var(--bg-color); color: var(--text-color); 
      min-height: 100vh; min-height: 100dvh; overflow: hidden; transition: background-color 0.3s;
      background-size: cover; background-position: center;
      background-attachment: fixed;
    }

    /* Botão Flutuante do Menu */
    #toggle-btn { 
      position: fixed; top: 15px; left: 15px; z-index: 1001;
      background: var(--modal-bg); color: var(--text-color); border: none; 
      padding: 10px 15px; border-radius: 12px; cursor: pointer; font-size: 20px; 
      box-shadow: var(--shadow-3d); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }

    /* Menu Lateral (Sidebar) */
    #sidebar { 
      width: 250px; background: var(--sidebar-color);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255,255,255,0.2); 
      display: flex; flex-direction: column; transition: transform 0.3s ease, width 0.3s ease; 
      z-index: 900; box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      padding-top: 70px;
    }
    
    #sidebar.collapsed { width: 70px; }
    #sidebar.collapsed .menu-text, #sidebar.collapsed h3 { display: none; }
    
    .menu-item { display: flex; align-items: center; width: 100%; padding: 15px; color: var(--text-color); background: transparent; border: 0; font: inherit; text-align: left; cursor: pointer; transition: 0.2s; }
    .menu-item:hover { background-color: rgba(0,0,0,0.05); }
    .menu-icon { font-size: 20px; margin-right: 15px; }

    /* Área Central */
    #main-content { 
      flex: 1; padding: 20px; overflow-y: auto; display: flex; 
      flex-direction: column; position: relative; padding-top: 70px; 
    }
    #area-botoes { display: flex; gap: 25px; flex-wrap: wrap; margin-top: 20px; flex: 1; justify-content: center; align-content: flex-start; }

    /* Cards dos Apps com efeito 3D */
    .app-card {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 140px; height: 140px; background: var(--card-bg); border-radius: 20px;
      text-decoration: none; color: var(--text-color); 
      box-shadow: var(--shadow-3d); transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .app-card:active { box-shadow: var(--inset-3d); transform: scale(0.95); }
    
    .app-emoji { font-size: 45px; margin-bottom: 10px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); }
    .app-name { font-weight: 700; font-size: 13px; text-align: center; }
    
    /* Botões de Ação no Card */
    .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; }
    .card-btn { 
      background: var(--bg-color); border: none; border-radius: 50%; cursor: pointer; 
      padding: 6px; font-size: 12px; box-shadow: var(--shadow-3d); transition: 0.2s; 
    }
    .card-btn:active { box-shadow: var(--inset-3d); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--primary-blue);
      outline-offset: 3px;
    }

    /* Modais */
    .modal-overlay { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.3s;
    }
    .modal-overlay.show { opacity: 1; }
    
    .modal-box { 
      background: var(--modal-bg); padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; 
      display: flex; flex-direction: column; gap: 15px; color: var(--text-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.2);
      transform: translateY(20px); transition: transform 0.3s;
    }
    .modal-overlay.show .modal-box { transform: translateY(0); }
    
    .modal-box input, .modal-box select { 
      padding: 12px; background: var(--bg-color); border: none; border-radius: 10px; 
      width: calc(100% - 24px); box-shadow: var(--inset-3d); color: var(--text-color); outline: none;
    }
    .modal-box label { font-size: 12px; font-weight: bold; margin-bottom: -10px; }
    .modal-box form { display: flex; flex-direction: column; gap: 15px; }
    
    .btn-salvar { background: var(--primary-blue); color: white; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4); }
    .btn-fechar { background: transparent; color: var(--text-color); padding: 12px; border: 1px solid var(--text-color); border-radius: 10px; cursor: pointer; }

    /* Tela de Carregamento */
    #progress-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 9999;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    .progress-container { width: 80%; max-width: 300px; background: #333; border-radius: 20px; height: 15px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); margin-top: 15px;}
    #progress-bar { height: 100%; width: 35%; background: linear-gradient(90deg, #4285f4, #00d2ff); animation: progresso-indeterminado 1.1s ease-in-out infinite; }
    #progress-text { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    @keyframes progresso-indeterminado {
      from { transform: translateX(-120%); }
      to { transform: translateX(320%); }
    }

    #status-area {
      display: none; margin: 30px auto; max-width: 520px; padding: 20px;
      border-radius: 16px; background: var(--modal-bg); text-align: center;
      box-shadow: var(--shadow-3d);
    }
    #status-area.show { display: block; }
    #toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 10000;
      max-width: min(360px, calc(100vw - 40px)); padding: 14px 18px;
      border-radius: 12px; color: #fff; background: #207a45;
      box-shadow: 0 12px 30px rgba(0,0,0,.35); opacity: 0;
      transform: translateY(15px); pointer-events: none; transition: .2s;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { background: #a52b2b; }
    [hidden] { display: none !important; }
    .auth-note { margin: 0; font-size: 12px; line-height: 1.45; opacity: .8; }
    .auth-actions { display: flex; flex-direction: column; gap: 10px; }

    /* Rodapé */
    footer { text-align: center; padding: 15px; margin-top: auto; font-size: 11px; font-weight: bold; opacity: 0.7; }
    .store-badges { display: flex; justify-content: center; gap: 10px; margin-bottom: 5px; }
    .store-badges img { height: 25px; filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.2)); }

    @media (max-width: 768px) {
      #sidebar { position: fixed; height: 100vh; height: 100dvh; transform: translateX(-100%); width: 250px; left: 0; top: 0; padding-top: 70px; }
      #sidebar.mobile-open { transform: translateX(0); } 
      #toggle-btn { position: fixed; top: 10px; left: 10px; z-index: 1001; }
    }
  </style>
</head>
<body>

  <button id="toggle-btn" type="button" title="Menu" aria-label="Abrir ou fechar menu" aria-controls="sidebar" aria-expanded="false">☰</button>

  <nav id="sidebar">
    <h3 style="padding: 0 15px 5px 15px; margin-top: 10px;">Ajustes</h3>
    
    <button id="btnNovoApp" type="button" class="menu-item admin-only" hidden>
      <span class="menu-icon">➕</span><span class="menu-text">Novo App</span>
    </button>
    <button id="btnAparencia" type="button" class="menu-item admin-only" hidden>
      <span class="menu-icon">🎨</span><span class="menu-text">Aparência</span>
    </button>
    <button id="btnLogin" type="button" class="menu-item">
      <span class="menu-icon">🔐</span><span id="textoLogin" class="menu-text">Entrar como administrador</span>
    </button>
  </nav>

  <main id="main-content">
    <h2 style="text-align: center; margin-top: 0;">Meus Aplicativos</h2>
    <div id="area-botoes"></div>
    <div id="status-area" role="status">
      <p id="status-mensagem"></p>
      <button id="btnTentarNovamente" type="button" class="btn-salvar">Tentar novamente</button>
    </div>

    <footer>
      <div class="store-badges">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
      </div>
      <div>Since @2026 - Versão 1.5 - Build 09.06.26</div>
    </footer>
  </main>

  <div id="modalApp" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloModalApp">
    <div class="modal-box" tabindex="-1">
      <h2 id="tituloModalApp" style="margin:0; text-align:center;">Configurar App</h2>
      <form id="formApp">
        <input type="hidden" id="inputId">
        <label for="inputNome">Nome do aplicativo</label>
        <input type="text" id="inputNome" placeholder="Nome do Aplicativo" maxlength="60" required>
        <label for="inputUrl">Link HTTPS</label>
        <input type="url" id="inputUrl" placeholder="https://..." inputmode="url" required>
        <label for="inputEmoji">Emoji principal</label>
        <input type="text" id="inputEmoji" placeholder="Ex.: 📊" maxlength="12" required>
        <button id="btnSalvarApp" type="submit" class="btn-salvar">Gravar no Banco</button>
        <button type="button" class="btn-fechar" data-close-modal="modalApp">Voltar</button>
      </form>
    </div>
  </div>

  <div id="modalPerfil" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloModalPerfil">
    <div class="modal-box" tabindex="-1">
      <h2 id="tituloModalPerfil" style="margin:0; text-align:center;">Estilo e Fundo</h2>
      
      <label for="selectTema">Tema:</label>
      <select id="selectTema">
        <option value="claro">Tema Claro (Light)</option>
        <option value="escuro">Tema Escuro (Dark 3D)</option>
      </select>
      
      <label for="selectFundo">Plano de Fundo:</label>
      <select id="selectFundo">
        <option value="gta_6.png">GTA 6</option>
        <option value="spider_man.png">Spider-Man</option>
        <option value="combat_8.png">Combat 8</option>
        <option value="prime.png">Prime</option>
      </select>
      
      <button id="btnSalvarPerfil" type="button" class="btn-salvar">Aplicar Mudanças</button>
      <button type="button" class="btn-fechar" data-close-modal="modalPerfil">Voltar</button>
    </div>
  </div>

  <div id="modalLogin" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloModalLogin">
    <div class="modal-box" tabindex="-1">
      <h2 id="tituloModalLogin" style="margin:0; text-align:center;">Acesso administrativo</h2>
      <form id="formLogin">
        <label for="inputEmail">E-mail</label>
        <input type="email" id="inputEmail" placeholder="seu@email.com" autocomplete="email" required>
        <label for="inputSenha">Senha</label>
        <input type="password" id="inputSenha" placeholder="Mínimo de 8 caracteres" minlength="8" autocomplete="current-password" required>
        <p class="auth-note">O primeiro cadastro precisa confirmar o e-mail e solicitar autorização administrativa.</p>
        <div class="auth-actions">
          <button id="btnEntrar" type="submit" class="btn-salvar">Entrar</button>
          <button id="btnCriarConta" type="button" class="btn-fechar">Criar primeiro acesso</button>
          <button type="button" class="btn-fechar" data-close-modal="modalLogin">Voltar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="progress-overlay" role="status" aria-live="polite">
    <div id="progress-text">Processando...</div>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"
    integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti"
    crossorigin="anonymous"></script>
  <script>
    'use strict';

    const SUPABASE_URL = 'https://nrypuyicgnenqiukgebj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_PAu64quxhvQEUV6lYN0R0w_rxNHyfoD';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const FUNDOS_PERMITIDOS = new Set(['gta_6.png', 'spider_man.png', 'combat_8.png', 'prime.png']);
    const TEMAS_PERMITIDOS = new Set(['claro', 'escuro']);

    let imagemFundoGlobal = localStorage.getItem('meuApp_Imagem') || "gta_6.png";
    let temaSalvo = localStorage.getItem('meuApp_Tema') || "claro";
    let ultimoElementoFocado = null;
    let toastTimer = null;
    let usuarioAtual = null;
    let ehAdmin = false;

    if (!FUNDOS_PERMITIDOS.has(imagemFundoGlobal)) imagemFundoGlobal = 'gta_6.png';
    if (!TEMAS_PERMITIDOS.has(temaSalvo)) temaSalvo = 'claro';
    if (temaSalvo === 'escuro') document.body.classList.add('dark-mode');
    document.body.style.backgroundImage = `url('${imagemFundoGlobal}')`;

    function iniciarProgresso(mensagem) {
      document.getElementById('progress-text').innerText = mensagem;
      document.getElementById('progress-overlay').style.display = 'flex';
    }

    function finalizarProgresso() {
      document.getElementById('progress-overlay').style.display = 'none';
    }

    function mostrarToast(mensagem, tipo = 'sucesso') {
      const toast = document.getElementById('toast');
      clearTimeout(toastTimer);
      toast.textContent = mensagem;
      toast.classList.toggle('error', tipo === 'erro');
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 4500);
    }

    function mostrarStatus(mensagem, permitirNovaTentativa = true) {
      const status = document.getElementById('status-area');
      document.getElementById('status-mensagem').textContent = mensagem;
      document.getElementById('btnTentarNovamente').hidden = !permitirNovaTentativa;
      status.classList.add('show');
    }

    function ocultarStatus() {
      document.getElementById('status-area').classList.remove('show');
    }

    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const aberto = window.innerWidth <= 768
        ? sidebar.classList.toggle('mobile-open')
        : !sidebar.classList.toggle('collapsed');
      document.getElementById('toggle-btn').setAttribute('aria-expanded', String(aberto));
    }

    function abrirModal(id) {
      const overlay = document.getElementById(id);
      ultimoElementoFocado = document.activeElement;
      overlay.style.display = 'flex';
      setTimeout(() => overlay.classList.add('show'), 10);
      setTimeout(() => {
        const primeiroCampo = overlay.querySelector('input:not([type="hidden"]), select, button');
        primeiroCampo?.focus();
      }, 40);

      if (id === 'modalPerfil') {
        document.getElementById('selectTema').value = temaSalvo;
        document.getElementById('selectFundo').value = imagemFundoGlobal;
      }
    }

    function fecharModal(id) {
      const overlay = document.getElementById(id);
      overlay.classList.remove('show');
      setTimeout(() => { overlay.style.display = 'none'; }, 300);
      ultimoElementoFocado?.focus();
    }

    function prepararNovoApp() {
      const form = document.getElementById('formApp');
      form.reset();
      document.getElementById('inputId').value = '';
      document.getElementById('tituloModalApp').textContent = 'Novo App';
      document.getElementById('btnSalvarApp').textContent = 'Adicionar aplicativo';
      abrirModal('modalApp');
    }

    function aplicarTema(tema) {
      if (!TEMAS_PERMITIDOS.has(tema)) return;
      temaSalvo = tema;
      document.body.classList.toggle('dark-mode', tema === 'escuro');
      localStorage.setItem('meuApp_Tema', tema);
    }

    function normalizarUrl(valor) {
      const url = new URL(String(valor || '').trim());
      if (url.protocol !== 'https:') throw new Error('Use somente links HTTPS.');
      return url.href;
    }

    function normalizarApp(app) {
      if (!app || !Number.isFinite(Number(app.id))) throw new Error('ID inválido.');
      const nome = String(app.name || app.nome || '').trim().slice(0, 60);
      const emoji = String(app.emoji || '').trim().slice(0, 12);
      if (!nome || !emoji) throw new Error('Cadastro incompleto.');
      return {
        id: Number(app.id),
        nome,
        emoji,
        url: normalizarUrl(app.url)
      };
    }

    function atualizarInterfaceAdmin() {
      document.querySelectorAll('.admin-only').forEach((elemento) => {
        elemento.hidden = !ehAdmin;
      });
      const texto = document.getElementById('textoLogin');
      texto.textContent = usuarioAtual
        ? (ehAdmin ? `Sair (${usuarioAtual.email})` : 'Sair — acesso pendente')
        : 'Entrar como administrador';
    }

    async function verificarPermissaoAdmin(usuario) {
      if (!usuario) return false;
      const { data, error } = await supabaseClient
        .from('app_admins')
        .select('user_id')
        .eq('user_id', usuario.id)
        .maybeSingle();
      if (error) throw error;
      return Boolean(data);
    }

    async function solicitarAcessoAdmin(usuario) {
      const { error } = await supabaseClient
        .from('app_admin_requests')
        .insert({ user_id: usuario.id, email: usuario.email });
      if (error && error.code !== '23505') throw error;
    }

    async function atualizarSessao(usuario) {
      usuarioAtual = usuario || null;
      ehAdmin = false;
      if (usuarioAtual) {
        ehAdmin = await verificarPermissaoAdmin(usuarioAtual);
        if (!ehAdmin) await solicitarAcessoAdmin(usuarioAtual);
      }
      atualizarInterfaceAdmin();
      await carregarDados();
    }

    async function entrarComoAdministrador(evento) {
      evento.preventDefault();
      const form = document.getElementById('formLogin');
      if (!form.reportValidity()) return;

      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputSenha').value;
      const botao = document.getElementById('btnEntrar');
      botao.disabled = true;
      iniciarProgresso('Validando acesso...');
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await atualizarSessao(data.user);
        fecharModal('modalLogin');
        mostrarToast(ehAdmin
          ? 'Acesso administrativo liberado.'
          : 'Login confirmado. Sua autorização administrativa está pendente.');
      } catch (erro) {
        mostrarToast(`Não foi possível entrar. ${erro.message}`, 'erro');
      } finally {
        finalizarProgresso();
        botao.disabled = false;
      }
    }

    async function criarPrimeiroAcesso() {
      const form = document.getElementById('formLogin');
      if (!form.reportValidity()) return;

      const email = document.getElementById('inputEmail').value.trim();
      const password = document.getElementById('inputSenha').value;
      const botao = document.getElementById('btnCriarConta');
      botao.disabled = true;
      iniciarProgresso('Criando acesso...');
      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: window.location.href.split('#')[0] }
        });
        if (error) throw error;
        if (data.session) {
          await atualizarSessao(data.user);
          fecharModal('modalLogin');
          mostrarToast('Conta criada. A autorização administrativa foi solicitada.');
        } else {
          mostrarToast('Conta criada. Confirme o e-mail e depois faça o login.');
        }
      } catch (erro) {
        mostrarToast(`Não foi possível criar o acesso. ${erro.message}`, 'erro');
      } finally {
        finalizarProgresso();
        botao.disabled = false;
      }
    }

    async function abrirOuSairAdmin() {
      if (!usuarioAtual) {
        document.getElementById('formLogin').reset();
        abrirModal('modalLogin');
        return;
      }
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        mostrarToast(`Não foi possível sair. ${error.message}`, 'erro');
        return;
      }
      usuarioAtual = null;
      ehAdmin = false;
      atualizarInterfaceAdmin();
      await carregarDados();
      mostrarToast('Sessão encerrada.');
    }

    async function inicializarAplicacao() {
      iniciarProgresso('Iniciando...');
      try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error && error.name !== 'AuthSessionMissingError') throw error;
        await atualizarSessao(data?.user || null);
      } catch (erro) {
        usuarioAtual = null;
        ehAdmin = false;
        atualizarInterfaceAdmin();
        await carregarDados();
        mostrarToast(`A sessão administrativa não pôde ser restaurada. ${erro.message}`, 'erro');
      } finally {
        finalizarProgresso();
      }
    }

    async function compartilharLink(url, nome) {
      try {
        if (navigator.share) {
          await navigator.share({ title: nome, text: 'Acesse esta ferramenta:', url });
        } else {
          await navigator.clipboard.writeText(url);
          mostrarToast('Link copiado!');
        }
      } catch (erro) {
        if (erro.name !== 'AbortError') mostrarToast('Não foi possível compartilhar o link.', 'erro');
      }
    }

    function criarBotaoAcao(icone, titulo, aoClicar) {
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'card-btn';
      botao.textContent = icone;
      botao.title = titulo;
      botao.setAttribute('aria-label', titulo);
      botao.addEventListener('click', aoClicar);
      return botao;
    }

    function renderizarApps(appsRecebidos) {
      const container = document.getElementById('area-botoes');
      container.replaceChildren();
      let descartados = 0;

      appsRecebidos.forEach((registro) => {
        let app;
        try {
          app = normalizarApp(registro);
        } catch {
          descartados += 1;
          return;
        }

        const card = document.createElement('article');
        card.className = 'app-card';

        const acoes = document.createElement('div');
        acoes.className = 'card-actions';
        if (ehAdmin) {
          acoes.append(criarBotaoAcao('⚙️', `Editar ${app.nome}`, () => prepararEdicao(app)));
        }
        acoes.append(criarBotaoAcao('🔗', `Compartilhar ${app.nome}`, () => compartilharLink(app.url, app.nome)));

        const link = document.createElement('a');
        link.href = app.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.style.cssText = 'text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;width:100%';
        link.setAttribute('aria-label', `Abrir ${app.nome}`);

        const emoji = document.createElement('div');
        emoji.className = 'app-emoji';
        emoji.textContent = app.emoji;

        const nome = document.createElement('div');
        nome.className = 'app-name';
        nome.textContent = app.nome;

        link.append(emoji, nome);
        card.append(acoes, link);
        container.appendChild(card);
      });

      if (!container.children.length) {
        mostrarStatus('Nenhum aplicativo válido foi encontrado.', true);
      } else {
        ocultarStatus();
      }
      if (descartados) mostrarToast(`${descartados} registro(s) inválido(s) não foram exibidos.`, 'erro');
    }

    async function carregarDados() {
      iniciarProgresso('Sincronizando...');
      ocultarStatus();
      try {
        const [appsResultado, configResultado] = await Promise.all([
          supabaseClient
            .from('menu_apps')
            .select('id, name, url, emoji, sort_order, is_active')
            .order('sort_order', { ascending: true })
            .order('id', { ascending: true }),
          supabaseClient
            .from('menu_app_settings')
            .select('theme, background')
            .eq('id', 1)
            .maybeSingle()
        ]);

        if (appsResultado.error) throw appsResultado.error;
        if (configResultado.error) throw configResultado.error;

        const config = configResultado.data;
        if (config) {
          if (TEMAS_PERMITIDOS.has(config.theme)) aplicarTema(config.theme);
          if (FUNDOS_PERMITIDOS.has(config.background)) {
            imagemFundoGlobal = config.background;
            document.body.style.backgroundImage = `url('${imagemFundoGlobal}')`;
            localStorage.setItem('meuApp_Imagem', imagemFundoGlobal);
          }
        }
        renderizarApps(appsResultado.data || []);
      } catch (erro) {
        mostrarStatus(`Não foi possível carregar os aplicativos. ${erro.message}`, true);
      } finally {
        finalizarProgresso();
      }
    }

    async function salvarApp(evento) {
      evento.preventDefault();
      if (!ehAdmin) {
        mostrarToast('Entre com uma conta administrativa para salvar.', 'erro');
        return;
      }
      const form = document.getElementById('formApp');
      if (!form.reportValidity()) return;

      const id = document.getElementById('inputId').value;
      const nome = document.getElementById('inputNome').value.trim();
      const emoji = document.getElementById('inputEmoji').value.trim();
      let url;
      try {
        url = normalizarUrl(document.getElementById('inputUrl').value);
      } catch (erro) {
        mostrarToast(erro.message, 'erro');
        return;
      }
      if (!nome || !emoji) {
        mostrarToast('Preencha o nome e o emoji do aplicativo.', 'erro');
        return;
      }

      const botao = document.getElementById('btnSalvarApp');
      botao.disabled = true;
      iniciarProgresso('Salvando aplicativo...');
      try {
        const registro = {
          name: nome.slice(0, 60),
          url,
          emoji: emoji.slice(0, 12),
          updated_at: new Date().toISOString()
        };
        const resultado = id
          ? await supabaseClient.from('menu_apps').update(registro).eq('id', Number(id))
          : await supabaseClient.from('menu_apps').insert({ ...registro, sort_order: 9999 });
        if (resultado.error) throw resultado.error;

        fecharModal('modalApp');
        mostrarToast(id ? 'Aplicativo atualizado.' : 'Aplicativo adicionado.');
        await carregarDados();
      } catch (erro) {
        mostrarToast(`Não foi possível salvar. ${erro.message}`, 'erro');
      } finally {
        finalizarProgresso();
        botao.disabled = false;
      }
    }

    function prepararEdicao(app) {
      document.getElementById('formApp').reset();
      document.getElementById('tituloModalApp').textContent = 'Editar App';
      document.getElementById('btnSalvarApp').textContent = 'Salvar alterações';
      document.getElementById('inputId').value = app.id;
      document.getElementById('inputNome').value = app.nome;
      document.getElementById('inputUrl').value = app.url;
      document.getElementById('inputEmoji').value = app.emoji;
      abrirModal('modalApp');
    }

    async function salvarPerfil() {
      if (!ehAdmin) {
        mostrarToast('Entre com uma conta administrativa para alterar a aparência.', 'erro');
        return;
      }
      const botao = document.getElementById('btnSalvarPerfil');
      botao.disabled = true;
      iniciarProgresso('Sincronizando aparência...');
      const tema = document.getElementById('selectTema').value;
      const imagem = document.getElementById('selectFundo').value;

      if (!TEMAS_PERMITIDOS.has(tema) || !FUNDOS_PERMITIDOS.has(imagem)) {
        mostrarToast('Configuração de aparência inválida.', 'erro');
        finalizarProgresso();
        botao.disabled = false;
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('menu_app_settings')
          .update({
            theme: tema,
            background: imagem,
            updated_at: new Date().toISOString()
          })
          .eq('id', 1);
        if (error) throw error;

        imagemFundoGlobal = imagem;
        aplicarTema(tema);
        document.body.style.backgroundImage = `url('${imagemFundoGlobal}')`;
        localStorage.setItem('meuApp_Imagem', imagemFundoGlobal);
        fecharModal('modalPerfil');
        mostrarToast('Aparência atualizada.');
      } catch (erro) {
        mostrarToast(`Não foi possível salvar a aparência. ${erro.message}`, 'erro');
      } finally {
        finalizarProgresso();
        botao.disabled = false;
      }
    }

    document.getElementById('toggle-btn').addEventListener('click', toggleMenu);
    document.getElementById('btnNovoApp').addEventListener('click', prepararNovoApp);
    document.getElementById('btnAparencia').addEventListener('click', () => abrirModal('modalPerfil'));
    document.getElementById('btnLogin').addEventListener('click', abrirOuSairAdmin);
    document.getElementById('btnTentarNovamente').addEventListener('click', carregarDados);
    document.getElementById('formApp').addEventListener('submit', salvarApp);
    document.getElementById('formLogin').addEventListener('submit', entrarComoAdministrador);
    document.getElementById('btnCriarConta').addEventListener('click', criarPrimeiroAcesso);
    document.getElementById('btnSalvarPerfil').addEventListener('click', salvarPerfil);
    document.getElementById('selectTema').addEventListener('change', (evento) => aplicarTema(evento.target.value));

    document.querySelectorAll('[data-close-modal]').forEach((botao) => {
      botao.addEventListener('click', () => fecharModal(botao.dataset.closeModal));
    });
    document.querySelectorAll('.modal-overlay').forEach((overlay) => {
      overlay.addEventListener('click', (evento) => {
        if (evento.target === overlay) fecharModal(overlay.id);
      });
    });
    document.addEventListener('keydown', (evento) => {
      if (evento.key !== 'Escape') return;
      const modalAberto = [...document.querySelectorAll('.modal-overlay')]
        .find((modal) => modal.classList.contains('show'));
      if (modalAberto) fecharModal(modalAberto.id);
    });

    supabaseClient.auth.onAuthStateChange((_evento, sessao) => {
      const proximoUsuario = sessao?.user || null;
      if ((proximoUsuario?.id || null) === (usuarioAtual?.id || null)) return;
      setTimeout(() => {
        atualizarSessao(proximoUsuario).catch((erro) => {
          mostrarToast(`Falha ao atualizar a sessão. ${erro.message}`, 'erro');
        });
      }, 0);
    });

    inicializarAplicacao();
  </script>
</body>
</html>
