<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Central de Aplicativos</title>
  <style>
    /* Reset básico para remover margens e ocupar a tela toda */
    body { margin: 0; display: flex; font-family: sans-serif; background-color: #f0f2f5; height: 100vh; }
    
    /* Configuração visual da barra lateral esquerda */
    #sidebar { width: 250px; background: #ffffff; border-right: 1px solid #ccc; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    .menu-item { display: block; padding: 10px; color: #333; text-decoration: none; border-bottom: 1px solid #eee; margin-bottom: 5px;}
    .menu-item:hover { background-color: #f4f4f4; border-radius: 4px; }
    
    /* Área direita onde ficam os botões dos apps */
    #conteudo-principal { flex: 1; padding: 40px; overflow-y: auto; }
    #area-botoes { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
    
    /* Desenho dos "Cards" (Botões dos Aplicativos) */
    .app-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 160px; height: 140px; background-color: #ffffff;
      border-radius: 12px; text-decoration: none; color: #333;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s;
    }
    .app-btn:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
    .app-emoji { font-size: 48px; margin-bottom: 10px; }
    .app-nome { font-weight: bold; text-align: center; font-size: 14px; padding: 0 10px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>⚙️ Configurações</h3>
    <a href="#" class="menu-item">👤 Meu Perfil</a>
    <a href="#" class="menu-item">🎨 Aparência</a>
    <a href="#" class="menu-item">🔒 Permissões</a>
  </div>

  <div id="conteudo-principal">
    <h1>Meus Aplicativos</h1>
    <p>Selecione um aplicativo abaixo para acessar a ferramenta:</p>
    
    <div id="area-botoes">
      <p id="carregando">Buscando aplicativos na base de dados...</p>
    </div>
  </div>

  <script>
    // URL gerada pelo Google Apps Script
    // Cole a sua URL correta aqui embaixo!
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyMSRsTt9OzsfskfS559YunuIwZUofyK7VDtqWMQ3f3i1MAUW1lRm7Rff4nzBeDMK6C/exec';

    // Função que conecta na planilha para buscar os apps
    fetch(URL_SCRIPT)
      .then(response => response.json()) // Transforma a resposta em um objeto JavaScript
      .then(data => {
        const areaBotoes = document.getElementById('area-botoes');
        areaBotoes.innerHTML = ''; // Remove o texto de "Buscando..."
        
        // Laço de repetição para criar um botão para cada linha da planilha
        data.forEach(item => {
          const botao = document.createElement('a');
          botao.href = item.url;
          botao.target = "_blank"; // Abre em nova guia
          botao.className = "app-btn"; 
          
          // Preenche o botão com os dados lidos
          botao.innerHTML = `
            <div class="app-emoji">${item.emoji}</div>
            <div class="app-nome">${item.nome}</div>
          `;
          
          areaBotoes.appendChild(botao); // Adiciona na tela
        });
      })
      .catch(error => {
        console.error('Erro ao carregar os apps:', error);
        document.getElementById('area-botoes').innerHTML = '<p style="color: red;">Erro ao carregar.</p>';
      });
  </script>
</body>
</html>
